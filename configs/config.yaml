project:
  name: "credit-card-fraud-detection"
  variant: "V20"
  seed: 42
  track: "classic"

data:
  target: "Class"
  id_column: null
  time_column: "Time"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  sample_path: "data/sample.csv"

task:
  type: "binary"
  positive_label: 1

metric:
  primary: "pr_auc"
  secondary:
    - "f1"
    - "recall"
    - "precision"
    - "brier"
  threshold: 0.80
  higher_is_better: true

split:
  strategy: "time"
  train_size: 0.70
  val_size: 0.15
  test_size: 0.15

evaluation:
  ci_level: 0.95
  n_bootstrap: 1000
  n_errors: 30
  slice_column: null

monitoring:
  reference: "train"
  shift:
    - {column: "Amount", kind: "scale", factor: 1.5}
    - {column: "V1", kind: "add", value: 1.2}
  alerts:
    drift_share: 0.25
    metric_drop: 0.05
